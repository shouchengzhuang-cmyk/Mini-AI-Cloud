apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mini-ai-cloud.fullname" . }}-worker
  namespace: {{ include "mini-ai-cloud.systemNamespace" . }}
  labels:
    {{- include "mini-ai-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "mini-ai-cloud.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mini-ai-cloud.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/runtime-profiles: {{ include (print $.Template.BasePath "/runtime-profiles-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mini-ai-cloud.fullname" . }}-worker
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- include "mini-ai-cloud.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "mini-ai-cloud.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "worker.main"]
          envFrom:
            - configMapRef:
                name: {{ include "mini-ai-cloud.fullname" . }}-config
          env:
            - name: CONTROL_PLANE_ENABLED
              value: "false"
            - name: WORKER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.databaseUrl }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.redisUrl }}
            - name: API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.apiKeyPepper }}
            - name: WORKER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.workerAuthToken }}
            - name: SECRET_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.secretMasterKey }}
          startupProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: local-data
              mountPath: /var/lib/mini-ai-cloud
            - name: runtime-profiles
              mountPath: /etc/mini-ai-cloud
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.storage.tmpSizeLimit }}
        - name: local-data
          emptyDir:
            sizeLimit: {{ .Values.storage.localDataSizeLimit }}
        - name: runtime-profiles
          configMap:
            name: {{ include "mini-ai-cloud.fullname" . }}-runtime-profiles
            items:
              {{- range $path, $_ := .Files.Glob "runtime_profiles/*" }}
              - key: {{ base $path }}
                path: {{ printf "runtime_profiles/%s" (base $path) }}
              {{- end }}
