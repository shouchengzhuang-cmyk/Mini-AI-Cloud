apiVersion: v1
kind: Service
metadata:
  name: {{ include "mini-ai-cloud.fullname" . }}
  namespace: {{ include "mini-ai-cloud.systemNamespace" . }}
  labels:
    {{- include "mini-ai-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mini-ai-cloud.selectorLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
