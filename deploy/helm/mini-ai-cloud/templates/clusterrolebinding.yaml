apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mini-ai-cloud.fullname" . }}-worker-inventory
  labels:
    {{- include "mini-ai-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mini-ai-cloud.fullname" . }}-worker-inventory
subjects:
  - kind: ServiceAccount
    name: {{ include "mini-ai-cloud.fullname" . }}-worker
    namespace: {{ include "mini-ai-cloud.systemNamespace" . }}
