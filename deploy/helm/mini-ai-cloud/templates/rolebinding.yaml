apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mini-ai-cloud.fullname" . }}-control-plane
  namespace: {{ include "mini-ai-cloud.workloadNamespace" . }}
  labels:
    {{- include "mini-ai-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mini-ai-cloud.fullname" . }}-control-plane
subjects:
  - kind: ServiceAccount
    name: {{ include "mini-ai-cloud.fullname" . }}-control-plane
    namespace: {{ include "mini-ai-cloud.systemNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mini-ai-cloud.fullname" . }}-worker
  namespace: {{ include "mini-ai-cloud.workloadNamespace" . }}
  labels:
    {{- include "mini-ai-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mini-ai-cloud.fullname" . }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "mini-ai-cloud.fullname" . }}-worker
    namespace: {{ include "mini-ai-cloud.systemNamespace" . }}
