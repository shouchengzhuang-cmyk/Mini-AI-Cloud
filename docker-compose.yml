name: mini-docker-cloud

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: mini-docker-cloud:${APP_IMAGE_TAG:-local}
  init: true

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://task:local-dev-only@postgres:5432/task_platform}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CONTROL_PLANE_ENABLED: "${CONTROL_PLANE_ENABLED:-true}"
  CLUSTER_ID: ${CLUSTER_ID:-mini-docker-cloud-local}
  DEFAULT_TASK_TIMEOUT: "${DEFAULT_TASK_TIMEOUT:-60}"
  MAX_TASK_TIMEOUT: "${MAX_TASK_TIMEOUT:-86400}"
  MAX_TASK_RETRIES: "${MAX_TASK_RETRIES:-10}"
  MAX_RECOVERY_ATTEMPTS: "${MAX_RECOVERY_ATTEMPTS:-3}"
  RECOVERY_CLEANUP_GRACE_SECONDS: "${RECOVERY_CLEANUP_GRACE_SECONDS:-5}"
  RETRY_MAX_BACKOFF_SECONDS: "${RETRY_MAX_BACKOFF_SECONDS:-60}"
  TASK_LEASE_SECONDS: "${TASK_LEASE_SECONDS:-30}"
  LEASE_RENEW_INTERVAL: "${LEASE_RENEW_INTERVAL:-5}"
  OUTBOX_POLL_INTERVAL: "${OUTBOX_POLL_INTERVAL:-0.25}"
  SCHEDULER_POLL_INTERVAL: "${SCHEDULER_POLL_INTERVAL:-1}"
  REAPER_INTERVAL: "${REAPER_INTERVAL:-5}"
  CONTROL_OPERATION_TIMEOUT: "${CONTROL_OPERATION_TIMEOUT:-30}"
  CONTROL_SHUTDOWN_TIMEOUT: "${CONTROL_SHUTDOWN_TIMEOUT:-10}"
  HEALTH_CHECK_TIMEOUT: "${HEALTH_CHECK_TIMEOUT:-3}"
  BATCH_SIZE: "${BATCH_SIZE:-100}"
  LOG_STREAM_MAXLEN: "${LOG_STREAM_MAXLEN:-10000}"
  LOG_STREAM_TTL_SECONDS: "${LOG_STREAM_TTL_SECONDS:-86400}"
  READY_STREAM_MAXLEN: "${READY_STREAM_MAXLEN:-100000}"
  REDIS_SOCKET_TIMEOUT: "${REDIS_SOCKET_TIMEOUT:-5}"
  SSE_HEARTBEAT_SECONDS: "${SSE_HEARTBEAT_SECONDS:-10}"
  CPU_PRICE_PER_HOUR: "${CPU_PRICE_PER_HOUR:-0.05}"
  GPU_PRICE_PER_HOUR: "${GPU_PRICE_PER_HOUR:-1.0}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_platform}
      POSTGRES_USER: ${POSTGRES_USER:-task}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

  api:
    <<: *app-service
    command: ["python", "-m", "api.main"]
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

  worker:
    <<: *app-service
    command: ["python", "-m", "worker.main"]
    user: "0:0"
    environment:
      <<: *app-environment
      DOCKER_HOST: unix:///var/run/docker.sock
      WORKER_ID: ${WORKER_ID:-}
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      WORKER_LABELS: ${WORKER_LABELS:-runtime=docker,region=local}
      HEARTBEAT_INTERVAL: "${HEARTBEAT_INTERVAL:-5}"
      WORKER_OFFLINE_TIMEOUT: "${WORKER_OFFLINE_TIMEOUT:-15}"
      WORKER_SHUTDOWN_TIMEOUT: "${WORKER_SHUTDOWN_TIMEOUT:-30}"
      DOCKER_STOP_TIMEOUT: "${DOCKER_STOP_TIMEOUT:-5}"
      DOCKER_ALWAYS_PULL: "${DOCKER_ALWAYS_PULL:-false}"
      DOCKER_PIDS_LIMIT: "${DOCKER_PIDS_LIMIT:-256}"
      DOCKER_TMPFS_SIZE_MB: "${DOCKER_TMPFS_SIZE_MB:-64}"
      MAX_TASK_LOG_BYTES: "${MAX_TASK_LOG_BYTES:-10485760}"
      MAX_LOG_CHUNK_BYTES: "${MAX_LOG_CHUNK_BYTES:-65536}"
      LOG_DRAIN_TIMEOUT: "${LOG_DRAIN_TIMEOUT:-5}"
      ORPHAN_RECONCILE_INTERVAL: "${ORPHAN_RECONCILE_INTERVAL:-1}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import docker; assert docker.from_env().ping()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-40s}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

volumes:
  postgres-data:
  redis-data:
