[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mini-ai-cloud"
version = "0.4.0.dev0"
description = "Evidence-driven control plane for reliable AI workload scheduling and serving"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "cryptography>=44,<47",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "kubernetes-asyncio>=31,<36",
  "prometheus-client>=0.21,<1",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "fakeredis>=2.26,<3",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-psutil>=7.0,<8",
]

[project.scripts]
mini-cloud = "cli.__main__:main"
mini-docker-cloud = "cli.__main__:legacy_main"

[project.urls]
Repository = "https://github.com/shouchengzhuang-cmyk/Mini-AI-Cloud"
Issues = "https://github.com/shouchengzhuang-cmyk/Mini-AI-Cloud/issues"
Security = "https://github.com/shouchengzhuang-cmyk/Mini-AI-Cloud/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["api", "cli", "core", "models", "repositories", "scheduler", "worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["docker.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: requires database or Redis integration",
  "live: requires reachable real PostgreSQL or Redis backends",
  "docker: requires a reachable Docker Engine",
  "e2e: starts the complete service stack",
]
