name: Bug report
description: 报告可复现的缺陷、回归或错误行为
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请使用 Security Advisory 私下报告，不要在公开 Issue 中提交凭据或敏感日志。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明实际行为、预期行为和影响。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 请提供可重复执行的命令、输入和必要配置，所有敏感值需脱敏。
      placeholder: |
        1. checkout <commit>
        2. run <command>
        3. observe <result>
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: commit SHA、操作系统、Python、Docker/Kubernetes 及相关后端版本。
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 证据类型
      options:
        - REAL
        - SIMULATED
        - NOT RUN
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏证据
      description: 提供退出码、测试摘要或最小日志；不要粘贴密钥、Cookie 或生产数据。
  - type: textarea
    id: scope
    attributes:
      label: 已知边界
      description: 哪些场景可以复现，哪些场景尚未验证？
