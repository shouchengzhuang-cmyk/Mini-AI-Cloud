name: Feature request
description: 提议范围清晰、可验证的能力或改进
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先描述用户或工程问题，不要只描述方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明最小可交付范围、接口或行为变化。
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 非目标
      description: 明确本提议不解决的事项，防止范围扩张。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证与证据计划
      description: 需要哪些单元、集成、Docker、Kind 或真实后端证据？哪些只能 SIMULATED？
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与风险
      description: 是否影响 API、CLI、配置、数据库、部署或现有证据？
    validations:
      required: true
