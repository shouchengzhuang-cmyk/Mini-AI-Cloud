name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Validate package and CLI identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uv run python -c 'import importlib.metadata; print(importlib.metadata.metadata("mini-ai-cloud")["Name"])')" = "mini-ai-cloud"
          uv run mini-cloud --help >/dev/null
          legacy_output="$(uv run mini-docker-cloud --help 2>&1)"
          grep -Fq "deprecated" <<<"${legacy_output}"
      - name: Validate evidence contract
        run: uv run python scripts/validate_evidence.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy .
      - name: Unit tests
        run: uv run pytest -m "not integration and not docker and not e2e"
      - name: Run local fencing hero demo
        run: uv run mini-cloud demo fencing --output-dir build/hero-demo-ci
      - name: Collect commit-bound evidence bundle
        run: uv run mini-cloud evidence collect
      - name: Upload evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ github.sha }}
          path: build/evidence/${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: task_platform
          POSTGRES_USER: task
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task -d task_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://task:local-dev-only@127.0.0.1:5432/task_platform
      REDIS_URL: redis://127.0.0.1:6379/0
      LIVE_DATABASE_URL: postgresql+asyncpg://task:local-dev-only@127.0.0.1:5432/task_platform
      LIVE_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - name: Integration tests
        run: uv run pytest -m integration

  kind-serving-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.27.0
      KUBECTL_VERSION: v1.32.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Install pinned Kind and kubectl
        shell: bash
        run: |
          set -Eeuo pipefail
          tool_dir="${RUNNER_TEMP}/kind-serving-tools"
          mkdir -p "${tool_dir}"
          case "$(dpkg --print-architecture)" in
            amd64) tool_arch=amd64 ;;
            arm64) tool_arch=arm64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac

          kind_asset="kind-linux-${tool_arch}"
          kind_url="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${tool_dir}/${kind_asset}" "${kind_url}/${kind_asset}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${tool_dir}/${kind_asset}.sha256sum" \
            "${kind_url}/${kind_asset}.sha256sum"
          (cd "${tool_dir}" && sha256sum --check "${kind_asset}.sha256sum")
          mv "${tool_dir}/${kind_asset}" "${tool_dir}/kind"

          kubectl_url="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${tool_arch}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${tool_dir}/kubectl" "${kubectl_url}/kubectl"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${tool_dir}/kubectl.sha256" "${kubectl_url}/kubectl.sha256"
          echo "$(cat "${tool_dir}/kubectl.sha256")  ${tool_dir}/kubectl" \
            | sha256sum --check

          chmod 0755 "${tool_dir}/kind" "${tool_dir}/kubectl"
          echo "${tool_dir}" >>"${GITHUB_PATH}"
      - name: Validate Kind acceptance harness
        shell: bash
        run: |
          bash -n scripts/kind_serving.sh
          shellcheck scripts/kind_serving.sh
          uv run python - <<'PY'
          from pathlib import Path

          import yaml

          paths = [Path(".github/workflows/ci.yml"), *Path("deploy/kind-serving").glob("*.yaml")]
          for path in paths:
              documents = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              if not documents or any(document is None for document in documents):
                  raise SystemExit(f"empty YAML document in {path}")
              print(f"validated {path}: {len(documents)} document(s)")
          PY
      - name: Report pinned client versions
        shell: bash
        run: |
          kind version
          kubectl version --client=true
          docker version
      - name: Start real Kind serving stack
        run: make kind-serving-up
      - name: Run mandatory real Kind serving E2E
        run: make test-kind-serving
      - name: Collect credential-safe Kind diagnostics
        if: always()
        run: bash scripts/kind_serving.sh diagnostics
      - name: Delete Kind cluster and local credentials
        if: always()
        run: make kind-serving-down
