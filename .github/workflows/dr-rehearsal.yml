name: Destructive DR rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type YES to run the isolated destructive rehearsal
        required: true
        default: "NO"

permissions:
  contents: read

concurrency:
  group: destructive-dr-rehearsal
  cancel-in-progress: false

jobs:
  dr:
    if: github.event.inputs.confirm == 'YES'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONFIRM_DR: YES
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7, Node.js 24
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Run isolated destructive backup and restore
        run: make test-dr
      - name: Upload redacted DR evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: dr-rehearsal-${{ github.run_id }}
          path: build/dr-rehearsal
          if-no-files-found: error
          retention-days: 14
