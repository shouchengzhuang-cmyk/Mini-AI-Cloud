name: Destructive DR rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type YES to run the isolated destructive rehearsal
        required: true
        default: "NO"

permissions:
  contents: read

concurrency:
  group: destructive-dr-rehearsal
  cancel-in-progress: false

jobs:
  dr:
    if: github.event.inputs.confirm == 'YES'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONFIRM_DR: YES
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Run isolated destructive backup and restore
        run: make test-dr
      - name: Upload redacted DR evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dr-rehearsal-${{ github.run_id }}
          path: build/dr-rehearsal
          if-no-files-found: error
          retention-days: 14
